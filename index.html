<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tarab</title>
<meta name="theme-color" content="#09080d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarab">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/urbanist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
<div id="boot" class="boot"><span class="boot-mark">tarab</span></div>

<!-- sign in -->
<section id="auth" class="auth" hidden>
  <div class="auth-disc" aria-hidden="true"><img src="img/auth.jpg" alt=""></div>
  <div class="auth-inner">
    <h1 class="wordmark">tarab</h1>
    <p class="auth-lede">Your music, saved on your phone, even without internet.</p>
    <form id="auth-form" autocomplete="on">
      <label class="field"><span>Email</span><input id="auth-email" type="email" inputmode="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input id="auth-pass" type="password" autocomplete="current-password" minlength="8" required></label>
      <p id="auth-err" class="form-err" role="alert"></p>
      <button class="btn btn-lav btn-block" id="auth-submit" type="submit">Sign in</button>
    </form>
    <button class="btn-text" id="auth-switch" type="button">First time? Create an account</button>
  </div>
</section>

<!-- main -->
<div id="shell" class="shell" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Menu">
    <div class="sb-brand"><img src="icons/icon-192.png" alt=""><b>tarab</b></div>
    <nav class="sb-nav">
      <button data-go="songs" class="on"><svg><use href="#i-home"/></svg>Songs</button>
      <button data-go="search"><svg><use href="#i-search"/></svg>Search</button>
      <button data-go="playlists"><svg><use href="#i-stack"/></svg>Playlists</button>
      <button data-go="add"><svg><use href="#i-plus-circle"/></svg>Add<b class="badge sb-badge" id="add-badge-2" hidden></b></button>
      <button data-go="settings"><svg><use href="#i-sliders"/></svg>Settings</button>
    </nav>
    <p class="sb-label">Your playlists</p>
    <div class="sb-pls" id="sb-pls"></div>
    <div class="sb-foot">
      <button class="sb-install" id="sb-install" hidden><svg><use href="#i-cloud-down"/></svg>Install Tarab on this PC</button>
      <button class="sb-me" data-profile><span class="avatar" id="sb-avatar"></span><span><b id="sb-name"></b><small>Profile</small></span></button>
    </div>
  </aside>
  <main id="views">
    <div class="tab" id="tab-songs" data-tab="songs"></div>
    <div class="tab" id="tab-search" data-tab="search" hidden></div>
    <div class="tab" id="tab-playlists" data-tab="playlists" hidden></div>
    <div class="tab" id="tab-add" data-tab="add" hidden></div>
    <div class="tab" id="tab-settings" data-tab="settings" hidden></div>
  </main>

  <div class="dock">
    <div id="mini" class="mini" hidden role="button" tabindex="0" aria-label="Open player">
      <span class="mini-art">
        <svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22.5" class="ring-bg"/><circle cx="24" cy="24" r="22.5" class="ring-fg"/></svg>
        <span class="mini-disc"><svg><use href="#i-note"/></svg><img alt=""></span>
      </span>
      <span class="mini-text"><span class="mini-title"></span><span class="mini-artist"></span></span>
      <button class="mini-btn" data-act="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
      <button class="mini-btn play" data-act="toggle" aria-label="Play"><svg><use href="#i-play"/></svg></button>
    </div>
    <nav class="navpill" id="tabbar">
      <button data-go="songs" class="on" aria-label="Songs"><svg><use href="#i-home"/></svg></button>
      <button data-go="search" aria-label="Search"><svg><use href="#i-search"/></svg></button>
      <button data-go="playlists" aria-label="Playlists"><svg><use href="#i-stack"/></svg></button>
      <button data-go="add" aria-label="Add"><svg><use href="#i-plus-circle"/></svg><b class="badge" id="add-badge" hidden></b></button>
      <button data-go="settings" aria-label="Settings"><svg><use href="#i-sliders"/></svg></button>
    </nav>
  </div>
</div>

<!-- desktop player bar -->
<div class="deskbar" id="deskbar" hidden>
  <div class="db-left">
    <button class="db-art" data-open-np aria-label="Open player"><svg><use href="#i-note"/></svg><img alt=""></button>
    <span class="db-text"><b class="db-title"></b><small class="db-artist"></small></span>
    <button class="ctl db-like" data-np="like" aria-label="Like"><svg><use href="#i-heart"/></svg></button>
  </div>
  <div class="db-center">
    <div class="db-controls">
      <button class="ctl" data-np="shuffle" aria-label="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
      <button class="round" data-np="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="play-btn sm" data-np="toggle" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <button class="round" data-np="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
      <button class="ctl" data-np="repeat" aria-label="Repeat"><svg><use href="#i-repeat"/></svg></button>
    </div>
    <div class="db-scrub"><span id="db-cur">0:00</span>
      <div class="scrub" id="db-scrub"><div class="scrub-track"><i class="scrub-zone"></i><i class="scrub-fill"></i><i class="scrub-knob"></i></div></div>
      <span id="db-dur">0:00</span></div>
  </div>
  <div class="db-right">
    <button class="chip mix" data-np="automix" aria-pressed="false"><span class="mix-wave"><i></i><i></i><i></i></span>AutoMix</button>
    <button class="ctl" data-open-lyrics aria-label="Lyrics"><svg><use href="#i-lyrics"/></svg></button>
    <button class="ctl" data-open-queue aria-label="Up next"><svg><use href="#i-queue"/></svg></button>
    <span class="db-vol"><button class="ctl" data-mute aria-label="Volume"><svg><use href="#i-vol"/></svg></button><input type="range" class="range vol" id="db-vol" min="0" max="1" step="0.01" aria-label="Volume"></span>
    <button class="ctl" data-open-np aria-label="Expand"><svg><use href="#i-expand"/></svg></button>
  </div>
</div>

<!-- now playing -->
<section id="np" class="np" aria-hidden="true">
  <div class="np-glow"></div>
  <div class="np-inner">
    <header class="np-top">
      <button class="round" data-np="close" aria-label="Close"><svg><use href="#i-chev-down"/></svg></button>
      <span class="np-label">Now playing</span>
      <span class="np-top-r">
        <button class="round np-like" data-np="like" aria-label="Like"><svg><use href="#i-heart"/></svg></button>
        <button class="round" data-np="more" aria-label="More"><svg><use href="#i-more"/></svg></button>
      </span>
    </header>

    <div class="np-stage">
      <div class="np-disc">
        <div class="np-halo"></div>
        <div class="np-art"><svg><use href="#i-note"/></svg><img alt="" class="np-art-cur"><img alt="" class="np-art-next"></div>
        <div id="yt-host" class="yt-host"></div>
      </div>
    </div>

    <div class="np-titles">
      <span class="online-chip" id="np-online" hidden><i></i>Online</span>
      <h2 class="np-title"></h2>
      <p class="np-artist"></p>
    </div>

    <button class="np-next" data-np="queue" aria-label="Show up next">
      <span class="np-next-line l0"></span>
      <span class="np-next-line l1"></span>
      <span class="np-next-line l2"></span>
    </button>

    <div class="scrub" id="scrub">
      <div class="scrub-track"><i class="scrub-zone"></i><i class="scrub-fill"></i><i class="scrub-knob"></i></div>
      <div class="scrub-times"><span id="t-cur">0:00</span><span id="t-left">0:00</span></div>
    </div>

    <div class="np-controls">
      <button class="ctl" data-np="repeat" aria-label="Repeat"><svg><use href="#i-repeat"/></svg></button>
      <button class="round mid" data-np="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="play-btn" data-np="toggle" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <button class="round mid" data-np="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
      <button class="ctl" data-np="queue" aria-label="Queue"><svg><use href="#i-queue"/></svg></button>
    </div>

    <div class="np-chips">
      <button class="chip" data-np="shuffle" aria-pressed="false"><svg><use href="#i-shuffle"/></svg>Shuffle</button>
      <button class="chip mix" data-np="automix" aria-pressed="false"><span class="mix-wave"><i></i><i></i><i></i></span>AutoMix</button>
      <button class="chip" data-np="lyrics" aria-pressed="false"><svg><use href="#i-lyrics"/></svg>Lyrics</button>
    </div>
  </div>

  <div class="np-lyrics" id="np-lyrics" hidden>
    <header class="ly-head">
      <span class="ly-art"><img alt=""></span>
      <span class="ly-titles"><b id="ly-title"></b><small id="ly-artist"></small></span>
      <button class="round" data-np="lyrics" aria-label="Close lyrics"><svg><use href="#i-x"/></svg></button>
    </header>
    <div class="ly-scroll" id="ly-scroll"><div class="ly-body" id="ly-body"></div></div>
    <div class="ly-foot">
      <button class="round sm" data-np="toggle" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <div class="ly-bar"><i id="ly-fill"></i></div>
    </div>
  </div>

  <div class="np-queue" id="np-queue" hidden>
    <header><h3>Up next</h3><button class="round" data-np="queue" aria-label="Close"><svg><use href="#i-x"/></svg></button></header>
    <ol id="np-queue-list"></ol>
  </div>
</section>

<div id="overlay" class="overlay" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
