name: tarab
# Tarab cloud: downloads waiting songs when your PC is off.
# Needs the repo secret TARAB_CLOUD_KEY (or TARAB_EMAIL + TARAB_PASSWORD).
# Runs by itself every ~5 minutes, or instantly if you saved a GitHub token in Tarab.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: tarab
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SB: https://faafhcbjprtsvyximbtm.supabase.co
      KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhYWZoY2JqcHJ0c3Z5eGltYnRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NDQ1ODAsImV4cCI6MjEwOTEyMDU4MH0.pSPeeY5Iai6DIeGQjcpHhThS7DNNUB-6GoiUpjoTyBg
      TARAB_CLOUD_KEY: ${{ secrets.TARAB_CLOUD_KEY }}
      TARAB_EMAIL: ${{ secrets.TARAB_EMAIL }}
      TARAB_PASSWORD: ${{ secrets.TARAB_PASSWORD }}
    steps:
      # quick check first: stop in a few seconds when nothing is waiting or the PC is on
      - name: check
        id: check
        run: |
          if [ -n "$TARAB_CLOUD_KEY" ]; then
            tok=$(curl -sS -X POST "$SB/functions/v1/cloudauth" -H "Content-Type: application/json" \
              -d "$(jq -n --arg k "$TARAB_CLOUD_KEY" '{key:$k}')" | jq -r .access_token)
          else
            body=$(jq -n --arg e "$TARAB_EMAIL" --arg p "$TARAB_PASSWORD" '{email:$e,password:$p}')
            tok=$(curl -sS -X POST "$SB/auth/v1/token?grant_type=password" -H "apikey: $KEY" -H "Content-Type: application/json" -d "$body" | jq -r .access_token)
          fi
          if [ -z "$tok" ] || [ "$tok" = "null" ]; then echo "Login failed: check the repo secrets"; exit 1; fi
          echo "::add-mask::$tok"
          h=(-H "apikey: $KEY" -H "Authorization: Bearer $tok")
          curl -fsS -X POST "$SB/rest/v1/user_settings?on_conflict=user_id" "${h[@]}" -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" -d "{\"cloud_seen\":\"$(date -u +%FT%TZ)\"}" || true
          waiting=$(curl -fsS "$SB/rest/v1/jobs?select=id&status=eq.pending&kind=neq.temp&limit=1" "${h[@]}" | jq length)
          seen=$(curl -fsS "$SB/rest/v1/worker_status?select=last_seen" "${h[@]}" | jq -r '.[0].last_seen // empty')
          pc=0
          if [ -n "$seen" ] && [ $(( $(date +%s) - $(date -d "$seen" +%s) )) -lt 90 ]; then pc=1; fi
          echo "waiting=$waiting pc_on=$pc event=${{ github.event_name }}"
          if [ "$waiting" -gt 0 ] && { [ "$pc" = 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.go == '1'
        name: helper
        run: docker run -d --name pot -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
      - if: steps.check.outputs.go == '1'
        uses: actions/checkout@v4
      - if: steps.check.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.check.outputs.go == '1'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: steps.check.outputs.go == '1'
        name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - if: steps.check.outputs.go == '1'
        name: packages
        run: pip install -q -r requirements.txt
      - if: steps.check.outputs.go == '1'
        name: download
        run: python tarab_worker.py --cloud
